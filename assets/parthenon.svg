<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 128">
  <!-- 파르테논 신전 — 세계역사 홈 타일 아이콘.
       46px 로 줄어들므로 기둥을 6개만 쓴다(실제는 정면 8개). 8개를 그리면
       작은 크기에서 기둥 사이가 붙어 하나의 덩어리로 보인다.
       어두운 배경 위에 올라가므로 밝은 대리석 색을 쓴다. -->
  <defs>
    <linearGradient id="pStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e6"/><stop offset=".55" stop-color="#e8dcc2"/><stop offset="1" stop-color="#c9b894"/>
    </linearGradient>
    <linearGradient id="pCol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbbb98"/><stop offset=".35" stop-color="#fbf4e4"/><stop offset="1" stop-color="#c3b08b"/>
    </linearGradient>
  </defs>

  <ellipse cx="84" cy="121" rx="68" ry="4" fill="#000" opacity=".22"/>

  <!-- 페디먼트(삼각 박공) -->
  <path d="M84 8 L160 44 L8 44 Z" fill="url(#pStone)" stroke="#a89566" stroke-width="3" stroke-linejoin="round"/>
  <!-- 박공 안쪽 그늘 — 조각이 들어가 있던 자리 -->
  <path d="M84 20 L139 46 L29 46 Z" fill="#bfae8a" opacity=".55"/>

  <!-- 엔타블러처(기둥 위 가로대) -->
  <rect x="12" y="44" width="144" height="9" fill="url(#pStone)" stroke="#a89566" stroke-width="2.6"/>
  <rect x="14" y="53" width="140" height="6" fill="#d9cbab" stroke="#a89566" stroke-width="2"/>

  <!-- 기둥 6개 (기둥머리 + 몸체) -->
  <g stroke="#a89566" stroke-width="2.2">
    <g fill="url(#pCol)">
      <rect x="20"  y="62" width="16" height="42" rx="2"/>
      <rect x="46"  y="62" width="16" height="42" rx="2"/>
      <rect x="72"  y="62" width="16" height="42" rx="2"/>
      <rect x="98"  y="62" width="16" height="42" rx="2"/>
      <rect x="124" y="62" width="16" height="42" rx="2"/>
    </g>
    <!-- 기둥머리 -->
    <g fill="#ece0c6">
      <rect x="17"  y="59" width="22" height="5" rx="1.5"/>
      <rect x="43"  y="59" width="22" height="5" rx="1.5"/>
      <rect x="69"  y="59" width="22" height="5" rx="1.5"/>
      <rect x="95"  y="59" width="22" height="5" rx="1.5"/>
      <rect x="121" y="59" width="22" height="5" rx="1.5"/>
    </g>
  </g>
  <!-- 기둥 세로 홈(플루팅) — 큰 화면에서만 보이는 정도로 옅게 -->
  <g stroke="#b9a884" stroke-width="1.2" opacity=".5">
    <line x1="25" y1="66" x2="25" y2="100"/><line x1="31" y1="66" x2="31" y2="100"/>
    <line x1="51" y1="66" x2="51" y2="100"/><line x1="57" y1="66" x2="57" y2="100"/>
    <line x1="77" y1="66" x2="77" y2="100"/><line x1="83" y1="66" x2="83" y2="100"/>
    <line x1="103" y1="66" x2="103" y2="100"/><line x1="109" y1="66" x2="109" y2="100"/>
    <line x1="129" y1="66" x2="129" y2="100"/><line x1="135" y1="66" x2="135" y2="100"/>
  </g>

  <!-- 기단(3단) -->
  <g stroke="#a89566" stroke-width="2.4">
    <rect x="14" y="104" width="140" height="6" fill="#e8dcc2"/>
    <rect x="9"  y="110" width="150" height="6" fill="#ddcfaf"/>
    <rect x="4"  y="116" width="160" height="6" fill="#cfc09e"/>
  </g>
</svg>
