<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 132">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset=".45" stop-color="#f0c04a"/>
      <stop offset="1" stop-color="#c98a13"/>
    </linearGradient>
  </defs>
  <!-- base (malachite green band + gold) -->
  <ellipse cx="50" cy="120" rx="20" ry="5" fill="#c98a13"/>
  <rect x="31" y="110" width="38" height="11" rx="3" fill="url(#gold)"/>
  <rect x="38" y="103" width="24" height="8" fill="#159c68"/>
  <!-- twisting body: narrow waist flaring up into two arms that cradle the globe -->
  <path fill="url(#gold)" d="
    M50 44
    C 41 44 35 37 33 31
    C 24 45 31 63 43 71
    C 41 82 41 94 45 103
    L 55 103
    C 59 94 59 82 57 71
    C 69 63 76 45 67 31
    C 65 37 59 44 50 44 Z"/>
  <!-- globe on top -->
  <circle cx="50" cy="28" r="15.5" fill="url(#gold)"/>
  <ellipse cx="50" cy="28" rx="6.5" ry="15.5" fill="none" stroke="#a9760f" stroke-width="1.3" opacity=".5"/>
  <line x1="34.5" y1="28" x2="65.5" y2="28" stroke="#a9760f" stroke-width="1.3" opacity=".5"/>
  <path d="M37 20 q13 7 26 0 M37 36 q13 -7 26 0" fill="none" stroke="#a9760f" stroke-width="1.1" opacity=".4"/>
</svg>
